# Keep the safe engine at O3. Bound inlining for the direct-browser artifact;
# same-source correctness/ABBA evidence: spec/benchmarks/wasm-geographic-profile-local.json
# and spec/performance/filter-tier-c-programmatic-2026-11-07/.
# This target-specific setting never affects the native cdylib.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "llvm-args=--inline-threshold=50"]
