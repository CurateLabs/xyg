# Native release stays O3. The single browser module uses O2 and
# bounded LLVM inlining; no feature/export/cap/runtime-limit reduction.
# Shared-source filter/catalog packaging and runtime qualification is recorded
# in spec/performance/filter-catalog-abi-union-2026-11-07/.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "llvm-args=--inline-threshold=50", "-C", "opt-level=2"]
