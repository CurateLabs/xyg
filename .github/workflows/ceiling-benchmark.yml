name: Interactive ceiling benchmark

# How many rows each library still lets a user interact with, and the peak
# resident memory that costs. Manual only: a full ladder spawns a fresh
# interpreter and a fresh browser per cell and runs for hours.
#
# Runner: Blacksmith macOS 15 M4 (12 vCPU, 48 GB RAM, 250 GB SSD, arm64).
# 48 GB is what makes the full 100M ladder reachable — the reference run peaks
# at 15.5 GiB for exact markers at 100M, which does not fit a 16 GB runner.
#
# Two things this lane is NOT:
#   * NOT free. macOS larger runners bill at a high multiplier and a full
#     ladder is multi-hour. Narrow `sizes` or `arms` for routine checks.
#   * NOT directly comparable to a different published reference machine.
#     This is an Apple Silicon M4 runner, and the browser rasterizes through
#     SwiftShader by default. Frame-time numbers from here must never be merged
#     into a hardware-GPU table (benchmarks/README.md: artifacts are
#     environment-scoped). Publish from the reference run; use this lane to
#     re-measure on demand and to catch regressions.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Existing ceiling ladder, mapped comparison, or bounded/100M colored hardware proof.
        type: choice
        options: [ceiling, density-comparison, colored-browser-hardware]
        default: ceiling
      sizes:
        description: Row counts to sweep.
        type: string
        default: "10,10000,100000,500000,1000000,2500000,5000000,10000000,25000000,50000000,100000000"
      arms:
        description: Which libraries to run.
        type: string
        default: "xy,xy-exact,plotly,matplotlib,datashader,plotly-resampler"
      repetitions:
        description: Fresh-process attempts per cell; ceiling keeps the best success, density comparison retains every attempt.
        type: string
        default: "3"
      timeout:
        description: Per-phase wall-clock limit in seconds.
        type: string
        default: "300"
      memory_gib:
        description: >-
          Per-process-tree RSS guard, not a runner-wide cap. The WebAgg arm
          keeps its server alive while the browser runs, so two trees can be
          resident at once; keep this under half the runner's 48 GB unless
          only single-tree arms are selected.
        type: string
        default: "20"
      interactive_budget_ms:
        description: Gesture p95 above this counts as rendering, not interacting.
        type: string
        default: "100"
      hardware_gl:
        description: Request hardware GL instead of SwiftShader. Ceiling records the obtained renderer; density comparison records the request with actual renderer unmeasured.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ceiling:
    name: Ceiling sweep (Blacksmith macOS M4, 48 GB)
    if: inputs.experiment == 'ceiling' || github.ref == 'refs/heads/main'
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Benchmark steps execute repository and dependency code; leaving the
          # token in git config would put it within their reach.
          persist-credentials: false
          # The distribution version is derived from the latest `xyg-v*` tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Record runner capacity
        # The ladder is only meaningful against the machine it ran on: a cell
        # that fails for want of memory or disk must be attributable, and the
        # memory or the 250 GB SSD must be attributable.
        run: |
          {
            echo "### Runner capacity"
            echo '```'
            sysctl -n machdep.cpu.brand_string
            echo "cores: $(sysctl -n hw.ncpu)"
            echo "RAM: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build native core
        run: cargo build --release

      - name: Install package + comparison deps
        # tornado is required for Matplotlib's WebAgg backend; without it the
        # matplotlib arm fails at backend switch rather than at a real ceiling.
        env:
          INPUT_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python --constraint benchmarks/requirements-ci.lock -e . --group dev
          if [ "$INPUT_EXPERIMENT" != "colored-browser-hardware" ]; then
            uv pip install --python .venv/bin/python --constraint benchmarks/requirements-ci.lock \
              matplotlib plotly kaleido datashader plotly-resampler \
              psutil websocket-client pillow pandas tornado
          fi
          if [ "$INPUT_EXPERIMENT" = "density-comparison" ]; then
            uv pip install --python .venv/bin/python --constraint benchmarks/requirements-ci.lock hvplot
          fi

      - name: Verify benchmark environment
        # uv run would re-sync uv.lock over the comparison constraints. Every
        # Python step uses this interpreter; harness children use sys.executable.
        # Check only shared dependencies and the explicitly selected arm stacks.
        # Match the Python target used to compile requirements-ci.lock.
        timeout-minutes: 2
        env:
          INPUT_EXPERIMENT: ${{ inputs.experiment }}
          INPUT_ARMS: "${{ inputs.arms }}"
        run: |
          .venv/bin/python - <<'PY'
          import importlib
          import importlib.metadata as metadata
          import json
          import os
          import sys
          from pathlib import Path

          assert sys.version_info[:2] == (3, 12), sys.version
          aggregation = {"numba": "numba", "llvmlite": "llvmlite", "datashader": "datashader",
                         "pandas": "pandas", "PIL": "pillow"}
          stacks = {
              "ceiling": {
                  "xy": {}, "xy-exact": {},
                  "plotly": {"plotly.express": "plotly", "pandas": "pandas"},
                  "matplotlib": {"matplotlib.backends.backend_webagg": "matplotlib",
                                 "tornado": "tornado", "PIL": "pillow"},
                  "datashader": aggregation,
                  "plotly-resampler": {"plotly.graph_objects": "plotly", "pandas": "pandas",
                                       "plotly_resampler": "plotly-resampler"},
              },
              "density-comparison": {
                  "xy-density": {},
                  "plotly-aggregate": {**aggregation, "plotly.offline": "plotly"},
                  "datashader-aggregate": {**aggregation, "hvplot.pandas": "hvplot",
                                           "holoviews": "holoviews", "panel": "panel", "bokeh": "bokeh"},
              },
          }
          stacks["colored-browser-hardware"] = {"xy": {}}
          experiment = os.environ["INPUT_EXPERIMENT"]
          assert experiment in stacks, ("unknown experiment", experiment)
          raw_arms = (["xy"] if experiment == "colored-browser-hardware"
                      else os.environ["INPUT_ARMS"].split(","))
          arms = ([arm.strip() for arm in raw_arms if arm.strip()]
                  if experiment == "ceiling" else raw_arms)
          assert arms and set(arms) <= set(stacks[experiment]), ("unknown or empty arms", arms)
          modules = {"numpy": "numpy", "psutil": "psutil", "websocket": "websocket-client"}
          if experiment == "colored-browser-hardware":
              modules = {"numpy": "numpy"}
          if experiment == "density-comparison":
              modules["tornado"] = "tornado"
          for arm in arms:
              modules.update(stacks[experiment][arm])
          pins = dict(line.split("==")
                      for line in Path("benchmarks/requirements-ci.lock").read_text().splitlines()
                      if line and not line.startswith((" ", "#")))
          versions = {}
          for name in modules.values():
              actual = metadata.version(name)
              versions[name] = actual
              expected = pins.get(name)
              assert expected is None or actual == expected, (name, actual, expected)
          for module in modules:
              importlib.import_module(module)
          import xyg.kernels as kernels
          assert kernels.BACKEND == "native", kernels.BACKEND
          print(json.dumps({"python": sys.version, "executable": sys.executable, "arms": arms,
                            "packages": versions, "xy_backend": kernels.BACKEND}, sort_keys=True))
          PY

      - name: Build render client
        # to_html embeds these bundles; a source checkout has no static/ dir.
        run: |
          npm ci
          node js/build.mjs

      - name: Install Chromium (Playwright)
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Free disk before the sweep
        # A 100M exact-marker page is ~1.07 GB on its own. The harness now
        # releases each page after its probe, but the toolchain above already
        # occupies several GB of the 250 GB SSD.
        run: df -h /

      - name: Run ceiling sweep
        # Dispatch inputs ride in via env, never interpolated into the shell
        # source: `${{ }}` expands before the shell parses, so an input
        # containing shell syntax would execute on the runner.
        env:
          INPUT_EXPERIMENT: ${{ inputs.experiment }}
          INPUT_SIZES: ${{ inputs.sizes }}
          INPUT_ARMS: ${{ inputs.arms }}
          INPUT_REPETITIONS: ${{ inputs.repetitions }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_MEMORY_GIB: ${{ inputs.memory_gib }}
          INPUT_HARDWARE_GL: ${{ inputs.hardware_gl }}
          XYG_DENSITY_100M_AUTHORITY: ${{ inputs.experiment == 'colored-browser-hardware' && '1' || '0' }}
        run: |
          CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME
          SOFTWARE="--software"
          if [ "$INPUT_HARDWARE_GL" = "true" ]; then SOFTWARE=""; fi
          if [ "$INPUT_EXPERIMENT" = "colored-browser-hardware" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test -z "$(git status --porcelain)"
            .venv/bin/python -c 'import os; from benchmarks._density_spill import hardware_context_guard; hardware_context_guard(dict(os.environ), authority=True)'
            mkdir -p "$RUNNER_TEMP/colored-browser-tmp"
            export TMPDIR="$RUNNER_TEMP/colored-browser-tmp"
            .venv/bin/python scripts/density_spill_browser_smoke.py \
              --preflight-only --gl hardware --chromium "$CHROME" --timeout 30 \
              --work-root "$TMPDIR" \
              --output "$RUNNER_TEMP/colored-browser-preflight-${GITHUB_SHA}.json"
            .venv/bin/python benchmarks/bench_density_e2e.py --workload colored-spill \
              --points 16384 --chunk-points 4096 --timeout 180 --max-rss-gib 4 --max-disk-gib 1 \
              --colored-browser-gl hardware --chrome "$CHROME" --temp-root "$TMPDIR" \
              --output "$RUNNER_TEMP/colored-browser-control-${GITHUB_SHA}.json" \
              --colored-browser-report "$RUNNER_TEMP/colored-browser-control-companion-${GITHUB_SHA}.json"
            .venv/bin/python scripts/verify_density_spill_report.py \
              "$RUNNER_TEMP/colored-browser-control-${GITHUB_SHA}.json" --artifact-root "$GITHUB_WORKSPACE"
            .venv/bin/python scripts/verify_density_spill_browser_report.py \
              "$RUNNER_TEMP/colored-browser-control-companion-${GITHUB_SHA}.json" \
              --host-report "$RUNNER_TEMP/colored-browser-control-${GITHUB_SHA}.json" \
              --require-hardware --artifact-root "$GITHUB_WORKSPACE"
            .venv/bin/python benchmarks/bench_density_e2e.py --workload colored-spill \
              --authority --points 100000000 --chunk-points 1000000 \
              --timeout 3600 --max-rss-gib 12 --max-disk-gib 4 \
              --colored-browser-gl hardware --chrome "$CHROME" --temp-root "$TMPDIR" \
              --output "$RUNNER_TEMP/colored-browser-100m-${GITHUB_SHA}.json" \
              --colored-browser-report "$RUNNER_TEMP/colored-browser-100m-companion-${GITHUB_SHA}.json"
            .venv/bin/python scripts/verify_density_spill_report.py \
              "$RUNNER_TEMP/colored-browser-100m-${GITHUB_SHA}.json" \
              --sha "$GITHUB_SHA" --artifact-root "$GITHUB_WORKSPACE"
            .venv/bin/python scripts/verify_density_spill_browser_report.py \
              "$RUNNER_TEMP/colored-browser-100m-companion-${GITHUB_SHA}.json" \
              --host-report "$RUNNER_TEMP/colored-browser-100m-${GITHUB_SHA}.json" \
              --require-hardware --sha "$GITHUB_SHA" --artifact-root "$GITHUB_WORKSPACE"
          elif [ "$INPUT_EXPERIMENT" = "density-comparison" ]; then
            HARDWARE=""
            if [ "$INPUT_HARDWARE_GL" = "true" ]; then HARDWARE="--hardware"; fi
            NUMBA_NUM_THREADS=2 OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 \
              .venv/bin/python benchmarks/bench_density_comparison.py \
                --sizes "$INPUT_SIZES" --arms "$INPUT_ARMS" \
                --profile f64-memmap --repetitions "$INPUT_REPETITIONS" \
                --chunk 1000000 --memory-gib "$INPUT_MEMORY_GIB" --disk-gib 20 \
                --timeout "$INPUT_TIMEOUT" --step-timeout 15 \
                $HARDWARE --chrome "$CHROME" \
                --out "$RUNNER_TEMP/density-comparison-${GITHUB_SHA}.json"
            .venv/bin/python scripts/verify_density_comparison_report.py \
              "$RUNNER_TEMP/density-comparison-${GITHUB_SHA}.json" \
              --sha "$GITHUB_SHA" --artifact-root "$GITHUB_WORKSPACE" \
              --sizes "$INPUT_SIZES" --arms "$INPUT_ARMS"
          else
            .venv/bin/python benchmarks/bench_ceiling.py \
              --sizes "$INPUT_SIZES" \
              --arms "$INPUT_ARMS" \
              --repetitions "$INPUT_REPETITIONS" \
              --timeout "$INPUT_TIMEOUT" \
              --memory-gib "$INPUT_MEMORY_GIB" \
              $SOFTWARE --chrome "$CHROME" \
              --out ceiling-results.json
          fi

      - name: Summarize
        # The report only exists if the sweep got far enough to write it; skip
        # rather than fail here so the sweep's own error stays the visible one.
        if: always() && hashFiles('ceiling-results.json') != ''
        env:
          INPUT_BUDGET_MS: ${{ inputs.interactive_budget_ms }}
        shell: bash
        run: |
          .venv/bin/python benchmarks/summarize_ceiling.py ceiling-results.json \
            --interactive-budget-ms "$INPUT_BUDGET_MS" \
            | tee ceiling-summary.md
          {
            echo "### Ceiling results"
            echo "Runner: blacksmith-12vcpu-macos-15 (Apple Silicon M4, 48 GB RAM)."
            echo "Compare only with reference runs that record the same hardware."
            cat ceiling-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plot
        if: always() && hashFiles('ceiling-results.json') != ''
        run: |
          .venv/bin/python benchmarks/plot_ceiling.py ceiling-results.json --out-dir charts
          # The exact-marker cut: every arm draws one marker per row, so the
          # comparison is like-for-like and xy gets no aggregation credit.
          .venv/bin/python benchmarks/plot_ceiling.py ceiling-results.json \
            --arms xy-exact,matplotlib,plotly --suffix=-exact --out-dir charts

      - name: Upload ceiling report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceiling-benchmark
          if-no-files-found: warn
          path: |
            ceiling-results.json
            ceiling-summary.md
            charts/
            ${{ runner.temp }}/density-comparison-${{ github.sha }}.json
            ${{ runner.temp }}/colored-browser-*-${{ github.sha }}.json
