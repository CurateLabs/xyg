name: CodSpeed

on:
  push:
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "spec/**"
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    # Dedicated CodSpeed bare metal keeps base/head runtime identity stable;
    # Blacksmith's general x64 pool can alternate Intel and AMD generations.
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `xyg-v*` tag, and a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      # The editable install below builds the render client from source via the
      # hatch hook (generated, not committed; §33). Pin Node so that build uses
      # a vite-compatible version rather than the runner's system Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # native kernels (BACKEND == "native"); without it, importing the compute
      # layer errors rather than running.
      - name: Build native core
        run: cargo build --release

      - name: Install package + benchmark deps
        env:
          XYG_REQUIRE_CARGO: "1"
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e . --group dev --group codspeed

      - name: Verify native benchmark backend
        run: |
          .venv/bin/python - <<'PY'
          import xy.kernels as k
          assert k.BACKEND == "native", f"CodSpeed requires native backend, got {k.BACKEND!r}"
          PY

      # The Rust benches (crates/xyg-engine/benches/kernels.rs) measure the
      # compute kernels directly, so a regression inside kernels.rs is
      # attributed to the kernel instead of surfacing mixed with FFI and NumPy
      # work in the pytest suite. `cargo codspeed build` is the instrumented
      # replacement for `cargo bench --no-run`; the plain build above stays
      # because Python loads the cdylib.
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked --version 4.6.0

      - name: Build Rust kernel benchmarks
        run: cargo codspeed build --bench kernels

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          # Authenticate with the job's OIDC token (id-token: write above).
          # A CODSPEED_TOKEN secret is not configured for CurateLabs/xyg and
          # is not required when the GitHub App is installed on the repo.
          # Run the native kernel benches and every CodSpeed-native pytest
          # module. Keep browser/install and cross-library process benchmarks in
          # benchmark-refresh.yml: they require wall-clock/browser measurements
          # and are not meaningful in CodSpeed simulation mode.
          # The explicit native path is kept for scripts/verify_ci_workflow.py.
          # Required invocation: benchmarks/test_codspeed_kernels.py --codspeed
          # The codspeed dependency group installs pytest-codspeed for this run.
          run: |
            cargo codspeed run --bench kernels
            .venv/bin/python -m pytest benchmarks/test_codspeed_*.py --codspeed
