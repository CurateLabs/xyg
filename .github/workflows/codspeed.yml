name: CodSpeed

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-main
  cancel-in-progress: true

jobs:
  detect:
    name: Check for changed main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.changed.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare with latest successful main benchmark
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          XYG_CURRENT_RUN_ID: ${{ github.run_id }}
          XYG_CURRENT_SHA: ${{ github.sha }}
          XYG_EVENT_NAME: ${{ github.event_name }}
          XYG_REF: ${{ github.ref }}
          XYG_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/codspeed_should_run.py

  benchmarks:
    name: Run benchmarks
    # Dedicated CodSpeed bare metal keeps base/head runtime identity stable;
    # Blacksmith's general x64 pool can alternate Intel and AMD generations.
    runs-on: codspeed-macro
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    permissions:
      contents: read
      id-token: write # for OpenID Connect authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `xyg-v*` tag, and a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      # The editable install below builds the render client from source via the
      # hatch hook (generated, not committed; §33). Pin Node so that build uses
      # a vite-compatible version rather than the runner's system Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # native kernels (BACKEND == "native"); without it, importing the compute
      # layer errors rather than running.
      - name: Build native core
        run: cargo build --release

      - name: Install package + benchmark deps
        env:
          XYG_REQUIRE_CARGO: "1"
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e . --group dev --group codspeed

      - name: Verify native benchmark backend
        run: |
          .venv/bin/python - <<'PY'
          import xyg.kernels as k
          assert k.BACKEND == "native", f"CodSpeed requires native backend, got {k.BACKEND!r}"
          PY

      # The Rust benches (crates/xyg-engine/benches/kernels.rs) measure the
      # compute kernels directly, so a regression inside kernels.rs is
      # attributed to the kernel instead of surfacing mixed with FFI and NumPy
      # work in the pytest suite. `cargo codspeed build` is the instrumented
      # replacement for `cargo bench --no-run`; the plain build above stays
      # because Python loads the cdylib.
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked --version 4.6.0

      - name: Build Rust kernel benchmarks
        run: cargo codspeed build -m simulation --bench kernels --bench aggregate --bench typed_series

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          # Authenticate with the job's OIDC token (id-token: write above).
          # A CODSPEED_TOKEN secret is not configured for CurateLabs/xyg and
          # is not required when the GitHub App is installed on the repo.
          # Run the native kernel benches and every CodSpeed-native pytest
          # module. Keep browser/install and cross-library process benchmarks in
          # benchmark-refresh.yml: they require wall-clock/browser measurements
          # and are not meaningful in CodSpeed simulation mode.
          # The explicit native path is kept for scripts/verify_ci_workflow.py.
          # Required invocation: benchmarks/test_codspeed_kernels.py --codspeed
          # The codspeed dependency group installs pytest-codspeed for this run.
          run: |
            set -euo pipefail
            cargo codspeed run --bench kernels --bench aggregate --bench typed_series
            .venv/bin/python -m pytest benchmarks/test_codspeed_*.py --codspeed

  authored-scene-browser-evidence:
    name: Authored-Scene browser evidence
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: typed-series-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Build strict-CSP direct-browser assets
        run: |
          npm ci
          cargo build --release
          cargo build -p xyg-wasm --release --target wasm32-unknown-unknown
          uv venv .venv
          uv pip install -p .venv/bin/python -e .
          node js/build.mjs
          node js/package-wasm.mjs target/wasm32-unknown-unknown/release/xyg_wasm.wasm
          npx playwright install chromium
      - name: Generate and measure four-size authored-Scene first paint
        env:
          XYG_AUTHORED_SCENE_DIR: authored-scenes
          XYG_EVIDENCE_PATH: authored-scene-browser-${{ github.sha }}.json
        run: |
          .venv/bin/python scripts/generate_authored_scene_benchmark.py --output-dir "$XYG_AUTHORED_SCENE_DIR"
          node benchmarks/bench_wasm_scene.mjs > "$XYG_EVIDENCE_PATH"
          python3 scripts/verify_wasm_scene_benchmark.py "$XYG_EVIDENCE_PATH" --sha "${{ github.sha }}"
      - name: Upload SHA-keyed raw authored-Scene evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authored-scene-browser-${{ github.sha }}
          if-no-files-found: error
          path: authored-scene-browser-${{ github.sha }}.json
