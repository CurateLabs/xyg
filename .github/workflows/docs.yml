name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "js/**"
      - "python/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "hatch_build.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package-lock.json"
      - "scripts/verify_docs_quickstart.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "js/**"
      - "python/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "hatch_build.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package-lock.json"
      - "scripts/verify_docs_quickstart.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Starlight docs build and verification
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The editable xyg package derives its version from xyg-v* tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/app/package-lock.json
      - name: Build the native core and shared browser client for documentation demos
        run: |
          cargo build --release
          npm ci
          node js/build.mjs
      - name: Install the checkout and Starlight dependencies
        run: |
          uv sync --frozen --group dev
          npm ci --prefix docs/app
      - name: Check documentation sources
        run: npm run check --prefix docs/app
      - name: Build the static documentation
        run: npm run build --prefix docs/app
      - name: Verify routes, links, metadata, Markdown assets, and demos
        run: npm run test --prefix docs/app
      - name: Run public docs quickstart against the checkout
        run: uv run --no-sync python scripts/verify_docs_quickstart.py
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-docs-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for production documentation checks
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Verify the built documentation in Chromium
        run: node docs/app/scripts/browser-smoke.mjs
      - name: Run documentation quality hooks
        run: |
          uv run --with pre-commit pre-commit run ruff-format --all-files
          uv run --with pre-commit pre-commit run ruff-check --all-files
          uv run --with pre-commit pre-commit run docs-app-codespell --all-files
      - name: Retain the verified static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xyg-docs-starlight
          path: docs/app/dist
          if-no-files-found: error
          retention-days: 14
