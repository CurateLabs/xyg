name: M2 assign milestone

# Cloud Agent App tokens can merge PRs but lack issues:write (403).
# Actions GITHUB_TOKEN assigns follow-on issues to Milestone 2, labels them,
# rescopes issue 276, and closes permission-probe leftovers.
# Idempotent — safe to re-run. Does not close the milestone.
# Dispatch-only (no push trigger) so merge alone does not mutate issues.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: m2-assign-milestone
  cancel-in-progress: false

jobs:
  assign:
    name: Assign M2 follow-ons / close probes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assign milestone, labels, rescope issue 276, close probes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/m2_assign_milestone.sh
