name: M2 Wave C close

# Cloud Agent tokens can merge PRs but may lack issues:write. Actions
# GITHUB_TOKEN posts completion comments and closes the M2 claimed-subset
# issues. Idempotent — safe if re-run after issues are already closed.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/m2-wave-c-close.yml"
      - "scripts/m2_wave_c_close.sh"

permissions:
  contents: read
  issues: write

concurrency:
  group: m2-wave-c-close
  cancel-in-progress: false

jobs:
  close:
    name: Ensure Wave C comments and M2 closed
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backfill completion comments / close Milestone 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/m2_wave_c_close.sh
