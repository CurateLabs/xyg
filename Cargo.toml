[workspace]
resolver = "2"
exclude = ["vendor/png", "vendor/crc32fast"]
members = ["crates/xyg-engine", "crates/xyg-core", "crates/xyg-wasm"]

# Whole-program optimization; `strip` keeps .dynsym, which ctypes binds
# against. `panic` must stay unwinding — xyg-core catches panics at the C ABI.
# LTO stays on the workspace release profile so the single shipped cdylib
# (`libxyg_core`) folds in xyg-engine with no extra runtime artifact.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Auditable upstream 0.18.1 with shared compile-time encoder capability.
[patch.crates-io]
png = { path = "vendor/png" }
crc32fast = { path = "vendor/crc32fast" }
