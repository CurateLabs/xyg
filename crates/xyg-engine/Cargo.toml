[package]
name = "xyg-engine"
version = "0.1.0"
edition = "2021"
description = "Safe XYG engine: algorithms and deterministic product policy"
license = "Apache-2.0"
publish = false

[lib]
name = "xyg_engine"

# Static chart export uses the focused `png` crate's fdeflate fast path;
# compression belongs beside rasterization so the hot path never round-trips
# a full framebuffer through a host language.
[dependencies]
png = "0.18.1"

[dev-dependencies]
# CodSpeed's divan compatibility layer: the same `divan` API, instrumented when
# it runs under the CodSpeed runner and a plain wall-clock harness otherwise.
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

# Kernel-level benchmarks (`cargo codspeed run --bench kernels`). `harness =
# false` because divan supplies its own `main`.
[[bench]]
name = "kernels"
harness = false
