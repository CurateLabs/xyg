[package]
name = "xyg-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin direct-browser WebAssembly lifecycle adapter over xyg-engine"
license = "Apache-2.0"
publish = false

[lib]
name = "xyg_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser adapter deliberately excludes native raster/PNG export. Browser
# painting stays in the existing TypeScript/WebGL client.
xyg-engine = { path = "../xyg-engine", default-features = false }

[dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native-only ABI parity tests call the shipped C seam. Keep xyg-core and its
# raster feature completely outside the direct-browser dependency graph.
xyg-core = { path = "../xyg-core" }

[[bench]]
name = "typed_series"
harness = false

[[bench]]
name = "aggregate"
harness = false
