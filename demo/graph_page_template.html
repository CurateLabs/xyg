<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #d8e0ea;
    --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #d1fae5 0%, transparent 50%),
      var(--bg);
  }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    height: 100%;
    min-height: 640px;
  }
  .stage {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 20px 20px 20px 24px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  header .meta { color: var(--muted); font-size: 0.85rem; }
  #chart {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: #f8fafc;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
  }
  .hint { margin-top: 10px; color: var(--muted); font-size: 0.8rem; }
  aside {
    border-left: 1px solid var(--line);
    background: rgba(255,255,255,0.86);
    backdrop-filter: blur(8px);
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  aside h2 {
    margin: 0 0 8px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 650;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    padding: 14px;
    min-height: 180px;
  }
  .card.empty {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  .card .kind {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card .title {
    font-size: 1.2rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .rows { display: grid; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 8px;
    font-size: 0.9rem;
  }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 550; word-break: break-word; }
  .legend { display: grid; gap: 6px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .swatch {
    width: 12px; height: 12px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.12);
  }
  .pinned { margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
  .pinned.on { color: var(--accent); font-weight: 650; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header>
      <h1>__TITLE__</h1>
      <div class="meta">__HOST__ · ForceAtlas2 · click a node or edge</div>
    </header>
    <div id="chart"></div>
    <div class="hint">Hover to preview · click to pin · drag to pan · scroll to zoom · double-click to reset</div>
  </section>
  <aside>
    <div>
      <h2>Selection</h2>
      <div id="props" class="card empty">Hover or click a node or edge to inspect its properties.</div>
      <div id="pin" class="pinned">Nothing pinned</div>
    </div>
    <div>
      <h2>Teams</h2>
      <div id="teams" class="legend"></div>
    </div>
    <div>
      <h2>Relations</h2>
      <div id="relations" class="legend"></div>
    </div>
  </aside>
</div>
<script>__CLIENT_JS__</script>
<script>
const spec = __SPEC__;
const META = __META__;
const b64 = "__B64__";
const bin = atob(b64);
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

const chartEl = document.getElementById("chart");
const propsEl = document.getElementById("props");
const pinEl = document.getElementById("pin");
xy.renderStandalone(chartEl, spec, bytes.buffer);

function legend(el, map) {
  el.innerHTML = "";
  for (const [name, color] of Object.entries(map)) {
    const row = document.createElement("div");
    row.className = "legend-item";
    row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${name}</span>`;
    el.appendChild(row);
  }
}
legend(document.getElementById("teams"), META.team_colors);
legend(document.getElementById("relations"), META.relation_colors);

let pinned = null;

function renderProps(row, { pinned: isPinned = false } = {}) {
  if (!row) {
    propsEl.className = "card empty";
    propsEl.textContent = "Hover or click a node or edge to inspect its properties.";
    pinEl.className = "pinned";
    pinEl.textContent = "Nothing pinned";
    return;
  }
  const isEdge = row.source != null && row.target != null;
  const title = isEdge
    ? `${row.source} → ${row.target}`
    : (row.label || row.id || "Item");
  const fields = isEdge
    ? [["From", row.source], ["To", row.target], ["Relation", row.relation], ["Weight", row.weight]]
    : [["ID", row.id], ["Role", row.role], ["Team", row.team], ["Weight", row.weight]];
  propsEl.className = "card";
  propsEl.innerHTML =
    `<div class="kind">${isEdge ? "Edge" : "Node"}</div>` +
    `<div class="title">${title}</div>` +
    `<div class="rows">${fields.map(([k, v]) =>
      `<div class="row"><div class="k">${k}</div><div class="v">${v ?? "—"}</div></div>`
    ).join("")}</div>`;
  pinEl.className = "pinned" + (isPinned ? " on" : "");
  pinEl.textContent = isPinned
    ? "Pinned — click another item to change"
    : "Preview (click to pin)";
}

chartEl.addEventListener("xy:hover", (e) => {
  if (pinned) return;
  renderProps((e.detail && e.detail.row) || null, { pinned: false });
});
chartEl.addEventListener("xy:leave", () => {
  if (pinned) return;
  renderProps(null);
});
chartEl.addEventListener("xy:click", (e) => {
  const row = e.detail && e.detail.row;
  if (!row) return;
  pinned = row;
  renderProps(row, { pinned: true });
});
</script>
</body>
</html>
